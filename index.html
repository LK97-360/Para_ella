<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Carta</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="background"></div>

    <div class="scene">
      <div class="shadow"></div>

      <div class="envelope" id="envelope">
        <!-- Back -->
        <div class="back"></div>

        <!-- Letter -->
        <div class="letter-wrapper">
          <div class="letter">
            <div class="paper">
              <!-- Left -->
              <section class="panel left">
                <div class="inside">
                  <h2>Para Ainhoa</h2>

                  <p>
                    Sé que recién nos estamos conociendo, pero me has caído bastante bien.
                  </p>
                </div>
              </section>

              <!-- Center -->

              <section class="panel center">
                <div class="cover">
                  <span class="mini"> Una </span>

                  <h1>Carta</h1>

                  <h2>Pa tu</h2>

                  <div class="heart">❤</div>
                </div>
              </section>

              <!-- Right -->

              <section class="panel right">
                <div class="inside">
                  <h2></h2>

                  <p>
                    Me gustaría que sigamos conociéndonos y ver qué puede salir de esto, creo que podría ser bonito intentarlo.
                  </p>
                </div>
              </section>
            </div>
          </div>
        </div>

        <!-- Pocket -->

        <div class="pocket">
          <div class="left-fold"></div>

          <div class="right-fold"></div>
        </div>

        <!-- Flap -->

        <div class="flap">
          <div class="seal">❤</div>
        </div>
      </div>
    </div>

    <div class="hint" id="hint">Toca el sobre</div>

    <script src="script.js"></script>
  </body>
</html>
